# Deploy on push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Require Firebase web secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          missing=
          [ -z "$VITE_FIREBASE_API_KEY" ] && missing="$missing VITE_FIREBASE_API_KEY"
          [ -z "$VITE_FIREBASE_PROJECT_ID" ] && missing="$missing VITE_FIREBASE_PROJECT_ID"
          [ -z "$VITE_FIREBASE_APP_ID" ] && missing="$missing VITE_FIREBASE_APP_ID"
          [ -z "$FIREBASE_TOKEN" ] && missing="$missing FIREBASE_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing required Actions secrets:$missing"
            exit 1
          fi

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_MASTER_ADMIN_EMAIL: ${{ secrets.VITE_MASTER_ADMIN_EMAIL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy hosting, rules, and storage
        run: npx firebase-tools@13 deploy --only hosting,firestore:rules,storage --project rabbitholeapps --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Cloud Functions
        id: functions
        continue-on-error: true
        run: npx firebase-tools@13 deploy --only functions --project rabbitholeapps --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Functions deploy status
        if: steps.functions.outcome != 'success'
        run: |
          echo "::warning::Cloud Functions deploy failed (site hosting still shipped)."
